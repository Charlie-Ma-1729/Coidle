# nginx 反向代理（HTTPS、WebSocket、壓縮）——拿到憑證之後用這份。
# 憑證路徑是 certbot 預設的 /etc/letsencrypt/live/coidle.imatw.org/。
# 取得憑證前請先用 deploy/nginx-http.conf（否則 nginx 會因為找不到憑證檔而無法載入）。

map $http_upgrade $coidle_connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  listen [::]:80;
  server_name coidle.imatw.org;
  location /.well-known/acme-challenge/ { root /var/www/html; }
  location / { return 301 https://$host$request_uri; }
}

server {
  # 不用獨立的「http2 on;」：Ubuntu 22.04／24.04 的 nginx 太舊，不認得那個指令
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name coidle.imatw.org;

  ssl_certificate     /etc/letsencrypt/live/coidle.imatw.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/coidle.imatw.org/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:coidle_ssl:10m;
  ssl_session_timeout 1d;
  add_header Strict-Transport-Security "max-age=31536000" always;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/javascript application/manifest+json image/svg+xml;
  gzip_min_length 1024;

  client_max_body_size 64k;

  # 即時連線：WebSocket 要保持長連線（玩家開著畫面時）
  location /ws {
    proxy_pass http://127.0.0.1:2330;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $coidle_connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location / {
    proxy_pass http://127.0.0.1:2330;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
