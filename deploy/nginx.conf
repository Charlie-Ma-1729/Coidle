# nginx 反向代理（HTTPS、WebSocket、壓縮）。
# 把 game.example.com 換成你的網域；憑證用 certbot 取得：
#   sudo certbot --nginx -d game.example.com
# 以下是 certbot 完成後的最終樣子（先貼 HTTP 那段取得憑證，再換成完整版也可以）。

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  listen [::]:80;
  server_name game.example.com;
  location /.well-known/acme-challenge/ { root /var/www/html; }
  location / { return 301 https://$host$request_uri; }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name game.example.com;

  ssl_certificate     /etc/letsencrypt/live/game.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/game.example.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=31536000" always;

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/javascript application/manifest+json image/svg+xml;
  gzip_min_length 1024;

  client_max_body_size 64k;

  # 即時連線：WebSocket 要保持長連線（玩家開著畫面時）
  location /ws {
    proxy_pass http://127.0.0.1:2330;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location / {
    proxy_pass http://127.0.0.1:2330;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
